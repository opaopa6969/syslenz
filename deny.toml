# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Ignored advisories — tracked in syslenz #23. These come from transitive
# deps (webpki-roots via ureq, paste via tonic, anyhow via various) that we
# cannot update without a breaking change upstream. Re-review on bump.
ignore = [
    "RUSTSEC-2026-0190",  # anyhow Error::downcast_mut unsoundness — upstream not yet patched in our pinned version
    "RUSTSEC-2024-0436",  # paste unmaintained — transitive via tonic/opentelemetry, no drop-in replacement
    "RUSTSEC-2026-0098",  # webpki name constraints URI — transitive via webpki-roots/ureq
    "RUSTSEC-2026-0099",  # webpki wildcard name constraints — same
    "RUSTSEC-2026-0104",  # webpki CRL parsing reachable panic — same
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
