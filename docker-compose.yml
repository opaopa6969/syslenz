# syslenz Docker Compose
#
# Web UI (recommended):
#   docker compose up -d
#   open http://localhost:3000
#
# TCP server mode + connect from host TUI:
#   docker compose --profile serve up -d
#   syslenz --connect localhost:9100
#
# Grafana + Prometheus dashboard:
#   docker compose --profile grafana up -d
#   open http://localhost:3001

services:
  # Web UI — default profile
  syslenz-web:
    image: opaopa6969/syslenz:latest
    ports:
      - "3000:3000"
    pid: "host"
    read_only: true
    command: ["--web", "3000"]

  # TCP server mode for TUI --connect
  syslenz-serve:
    image: opaopa6969/syslenz:latest
    ports:
      - "9100:9100"
    pid: "host"
    read_only: true
    command: ["--serve", "0.0.0.0:9100"]
    profiles:
      - serve

  # Prometheus metrics exporter
  syslenz-prometheus:
    image: opaopa6969/syslenz:latest
    ports:
      - "9101:9101"
    pid: "host"
    read_only: true
    command: ["--prometheus", "0.0.0.0:9101"]
    profiles:
      - grafana

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-storage:/var/lib/grafana
    depends_on:
      - syslenz-prometheus
    profiles:
      - grafana

volumes:
  grafana-storage:
