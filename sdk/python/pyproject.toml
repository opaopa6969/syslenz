[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syslenz4py"
version = "1.0.0"
description = "Python client for syslenz system monitoring. Zero dependencies, TCP protocol, JSON snapshots."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "opaopa6969", email = "opaopa6969@gmail.com"},
]
keywords = ["syslenz", "monitoring", "system", "metrics", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/opaopa6969/syslenz"
Repository = "https://github.com/opaopa6969/syslenz"
Issues = "https://github.com/opaopa6969/syslenz/issues"

[tool.setuptools.packages.find]
include = ["syslenz4py*"]
