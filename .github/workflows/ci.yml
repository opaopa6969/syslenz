name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "web", "otel"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --features "${{ matrix.features }}" -- -D warnings
        if: matrix.features != ''
      - name: Clippy (default)
        run: cargo clippy -- -D warnings
        if: matrix.features == ''
      - name: Build
        run: cargo build --features "${{ matrix.features }}"
        if: matrix.features != ''
      - name: Build (default)
        run: cargo build
        if: matrix.features == ''
      - name: Test
        run: cargo test
