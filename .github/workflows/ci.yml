name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Linux: full test suite
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "web", "otel"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --features "${{ matrix.features }}" -- -D warnings
        if: matrix.features != ''
      - name: Clippy (default)
        run: cargo clippy -- -D warnings
        if: matrix.features == ''
      - name: Build
        run: cargo build --features "${{ matrix.features }}"
        if: matrix.features != ''
      - name: Build (default)
        run: cargo build
        if: matrix.features == ''
      - name: Test
        run: cargo test

  # License audit via cargo-deny (disabled: manifest parse error on action v1;
  # re-enable after adding deny.toml and pinning a compatible action version)
  # deny:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: EmbarkStudios/cargo-deny-action@v1
  #       with:
  #         command: check licenses

  # macOS: build check (platform_macos.rs コンパイル確認)
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build
      - name: Test
        run: cargo test

  # Windows build is not supported yet (platform_windows.rs references proc::processes
  # and libc::geteuid which are unix-only). Skip until Windows support is added.
  # windows:
  #   runs-on: windows-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: dtolnay/rust-toolchain@stable
  #     - name: Build
  #       run: cargo build
  #     - name: Test
  #       run: cargo test

  # Java SDK
  java-sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: Build Java SDK
        run: cd sdk/java && mvn -B compile
