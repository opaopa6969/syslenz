name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Validate that CHANGELOG.md has an entry for this version
  changelog-check:
    name: Validate CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check CHANGELOG entry exists
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! grep -q "\[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for version ${VERSION}"
            echo "Please add a section: ## [${VERSION}] - YYYY-MM-DD"
            exit 1
          fi
          echo "Found CHANGELOG entry for ${VERSION}"

  # Validate crates.io packaging
  package-check:
    name: Validate crates.io package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Check package contents
        run: |
          echo "=== Files included in crate package ==="
          cargo package --list
          echo ""
          echo "=== Checking for unwanted files ==="
          if cargo package --list | grep -E "^(target/|\.git/)"; then
            echo "::error::Package contains unwanted files (target/ or .git/)"
            exit 1
          fi
          echo "No unwanted files found."

      - name: Dry-run publish
        run: cargo publish --dry-run
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build:
    name: Build ${{ matrix.target }}
    needs: [changelog-check, package-check]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: syslenz-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: syslenz-linux-aarch64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: syslenz-linux-x86_64-musl
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: syslenz-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: syslenz-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: syslenz-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      # Package as tar.gz (Unix) or zip (Windows)
      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/syslenz staging/
          cp README.md LICENSE CHANGELOG.md staging/ 2>/dev/null || true
          cd staging
          tar czf ../${{ matrix.artifact }}.tar.gz *
          cd ..

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/syslenz.exe staging/
          cp README.md LICENSE CHANGELOG.md staging/ 2>/dev/null || true
          cd staging
          7z a ../${{ matrix.artifact }}.zip *
          cd ..

      - name: Generate SHA256 (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            shasum -a 256 ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256
          else
            sha256sum ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256
          fi
          cat ${{ matrix.artifact }}.tar.gz.sha256

      - name: Generate SHA256 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          sha256sum ${{ matrix.artifact }}.zip > ${{ matrix.artifact }}.zip.sha256
          cat ${{ matrix.artifact }}.zip.sha256

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files and generate checksums.txt
        run: |
          mkdir -p release
          find artifacts -type f \( -name "syslenz-*" \) -exec cp {} release/ \;
          echo "=== Release files ==="
          ls -la release/

          # Generate consolidated checksums.txt
          cd release
          cat *.sha256 | sort > checksums.txt
          echo ""
          echo "=== checksums.txt ==="
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify dry-run
        run: cargo publish --dry-run

      - name: Publish
        run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  docker:
    name: Publish to Docker Hub
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          # major.minor for floating tag (e.g. 1.6)
          MINOR="$(echo "$VER" | cut -d. -f1-2)"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for ARM64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: FEATURES=web
          tags: |
            opaopa6969/syslenz:latest
            opaopa6969/syslenz:${{ steps.version.outputs.tag }}
            opaopa6969/syslenz:${{ steps.version.outputs.ver }}
            opaopa6969/syslenz:${{ steps.version.outputs.minor }}
          labels: |
            org.opencontainers.image.title=syslenz
            org.opencontainers.image.description=Wireshark for /proc — explore Linux system information as structured data
            org.opencontainers.image.version=${{ steps.version.outputs.ver }}
            org.opencontainers.image.source=https://github.com/opaopa6969/syslenz
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
